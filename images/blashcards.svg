<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Minimalist Grid/Tech background subtle -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#F3F4F6" stroke-width="1" />
  <line x1="600" y1="0" x2="600" y2="630" stroke="#F3F4F6" stroke-width="1" />
  
  <!-- Central Icon Group -->
  <g transform="translate(600, 270)">
    <!-- Back Card: Raw Document -->
    <path d="M -40 -40 L -40 -58 A 12 12 0 0 1 -28 -70 L 58 -70 A 12 12 0 0 1 70 -58 L 70 48 A 12 12 0 0 1 58 60 L 40 60" fill="none" stroke="#4B5563" stroke-width="6" stroke-linecap="round" />
    
    <!-- Document Lines on Back Card -->
    <line x1="-20" y1="-50" x2="50" y2="-50" stroke="#4B5563" stroke-width="6" stroke-linecap="round" />

    <!-- Front Card: Interactive Flashcard -->
    <rect x="-70" y="-40" width="110" height="130" rx="12" fill="none" stroke="#06B6D4" stroke-width="6" />
    
    <!-- Inside Front Card: AI / Terminal Engine -->
    <!-- Subtle document text being converted -->
    <line x1="-45" y1="-15" x2="15" y2="-15" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round" />
    <line x1="-45" y1="0" x2="-5" y2="0" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round" />
    
    <!-- CLI Prompt -->
    <polyline points="-40,20 -25,30 -40,40" fill="none" stroke="#F43F5E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-15" y1="40" x2="10" y2="40" stroke="#F43F5E" stroke-width="6" stroke-linecap="round" />
  </g>
  
  <!-- Typography -->
  <text x="600" y="450" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="42" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="6">BLASHCARDS</text>
</svg>
