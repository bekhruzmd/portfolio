<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Minimalist Grid/Tech background subtle -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#F3F4F6" stroke-width="1" />
  <line x1="600" y1="0" x2="600" y2="630" stroke="#F3F4F6" stroke-width="1" />
  
  <!-- Central Icon Group -->
  <g transform="translate(600, 270)">
    <!-- Outer Telemetry Arc / Radar -->
    <path d="M -120 20 A 120 120 0 0 1 120 20" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />
    
    <!-- Inner Data Arc / Dashboard Gauge -->
    <path d="M -90 10 A 90 90 0 0 1 90 10" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 14" />
    
    <!-- Live Tracking / Maintenance Node -->
    <circle cx="0" cy="-100" r="8" fill="#F43F5E" />
    <circle cx="0" cy="-100" r="22" fill="none" stroke="#F43F5E" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="-92" x2="0" y2="-60" stroke="#F43F5E" stroke-width="4" stroke-linecap="round" />

    <!-- Commercial Truck Silhouette -->
    <!-- Trailer -->
    <rect x="-55" y="-40" width="70" height="60" rx="6" fill="none" stroke="#0F172A" stroke-width="6" />
    
    <!-- Cab -->
    <path d="M 15 -15 L 40 -15 L 55 5 L 55 20 L 15 20 Z" fill="none" stroke="#0F172A" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Wheels -->
    <circle cx="-25" cy="20" r="10" fill="#FFFFFF" stroke="#06B6D4" stroke-width="6" />
    <circle cx="35" cy="20" r="10" fill="#FFFFFF" stroke="#06B6D4" stroke-width="6" />
    
    <!-- Speed / Motion Telemetry Lines -->
    <line x1="-130" y1="-15" x2="-80" y2="-15" stroke="#4B5563" stroke-width="4" stroke-linecap="round" />
    <line x1="-150" y1="5" x2="-75" y2="5" stroke="#4B5563" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <!-- Typography -->
  <text x="600" y="450" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="42" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="6">FLEETVIEW</text>
</svg>
