<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Minimalist Grid/Tech background subtle -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#F3F4F6" stroke-width="1" />
  <line x1="600" y1="0" x2="600" y2="630" stroke="#F3F4F6" stroke-width="1" />
  
  <!-- Central Icon Group -->
  <g transform="translate(600, 270)">
    <!-- Eye / Vision Input -->
    <path d="M -130 0 C -70 -70, -10 -70, 50 0 C -10 70, -70 70, -130 0 Z" fill="none" stroke="#0F172A" stroke-width="6" />
    <circle cx="-40" cy="0" r="14" fill="#06B6D4" />
    
    <!-- Soundwave / Speech Input -->
    <rect x="70" y="-25" width="6" height="50" rx="3" fill="#06B6D4" />
    <rect x="90" y="-45" width="6" height="90" rx="3" fill="#06B6D4" />
    <rect x="110" y="-20" width="6" height="40" rx="3" fill="#06B6D4" />
    <rect x="130" y="-55" width="6" height="110" rx="3" fill="#06B6D4" />
    <rect x="150" y="-30" width="6" height="60" rx="3" fill="#06B6D4" />

    <!-- Real-time Diagnostic Bridge -->
    <line x1="-160" y1="0" x2="180" y2="0" stroke="#F43F5E" stroke-width="4" opacity="0.9" />
  </g>
  
  <!-- Typography -->
  <text x="600" y="450" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="42" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="6">STROKE SHIELD</text>
</svg>
